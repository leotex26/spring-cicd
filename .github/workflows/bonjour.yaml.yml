name: tp

run-name: tp

on:
  workflow_dispatch:

jobs:
  dire-bonjour:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Afficher Bonjour
        run: echo "Bonjour depuis GitHub Actions !"
      - name: Lister les fichiers
        run: ls -la
  
  
  afficher-version:

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher la version de Java
        run: java --version

      - name: Afficher la version de Maven
        run: mvn --version

      - name: Afficher les fichiers
        run: ls -la
